</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kredocon - Leads (Supabase Working)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{font-family:system-ui;padding:20px;background:#f8fafc}
.card{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:16px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
button{background:#0ea5e9;color:white;padding:10px 16px;border:0;border-radius:8px;font-weight:600}
.lead{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.badge{padding:2px 8px;background:#10b981;color:white;border-radius:20px;font-size:12px}
</style>
</head><body>
<h2>● <span id="status">Connecting...</span></h2>
<div class="card">
<h3>Add Lead</h3>
<input id="fn" placeholder="First Name">
<input id="sn" placeholder="Surname">
<input id="ph" placeholder="Phone">
<input id="em" placeholder="Email">
<button onclick="addLead()">Save to Supabase</button>
<div id="msg" style="margin-top:10px;color:#0ea5e9"></div>
</div>

<div class="card">
<h3>Leads from Supabase (<span id="count">0</span>)</h3>
<div id="list">Loading...</div>
<button onclick="loadLeads()" style="margin-top:10px;background:#6366f1">Refresh</button>
</div>

<script>
const SUPABASE_URL = "https://insvyhxlrcmofevybrla.supabase.co";
const SUPABASE_KEY = "sb_publishable_CoMNUJuPwTfbATOWYnw8tQ_KhQpLAd3";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function init(){
  document.getElementById('status').textContent = 'Connected to Supabase';
  document.getElementById('status').style.color = '#10b981';
  await loadLeads();
}
async function addLead(){
  const fn = document.getElementById('fn').value.trim();
  const sn = document.getElementById('sn').value.trim();
  const ph = document.getElementById('ph').value.trim();
  const em = document.getElementById('em').value.trim();
  if(!fn || !sn){ alert('First name + Surname required'); return; }
  document.getElementById('msg').textContent = 'Saving...';
  try{
    const payload = {
      id: crypto.randomUUID(),
      first_name: fn,
      surname: sn,
      phone: ph,
      email: em,
      stage: 'New',
      form_data: {firstName:fn, surname:sn, phone:ph, email:em},
      created_at: new Date().toISOString()
    };
    const {data, error} = await supabaseClient.from('leads').insert(payload).select();
    if(error) throw error;
    document.getElementById('msg').textContent = '✅ SAVED! ID: '+payload.id;
    document.getElementById('fn').value='';document.getElementById('sn').value='';document.getElementById('ph').value='';document.getElementById('em').value='';
    await loadLeads();
  }catch(e){
    console.error(e);
    document.getElementById('msg').textContent = '❌ FAILED: '+e.message;
    alert('Save failed: '+e.message);
  }
}
async function loadLeads(){
  const list = document.getElementById('list');
  try{
    const {data, error} = await supabaseClient.from('leads').select('*').order('created_at',{ascending:false}).limit(100);
    if(error) throw error;
    document.getElementById('count').textContent = data.length;
    if(data.length===0){ list.innerHTML='<i>No leads yet - add one above</i>'; return; }
    list.innerHTML = data.map(r=>`<div class="lead"><div><b>${r.first_name||''} ${r.surname||''}</b><br><small>${r.phone||''} • ${r.email||''}</small></div><div><span class="badge">${r.stage||'New'}</span><br><small>${new Date(r.created_at).toLocaleString()}</small></div></div>`).join('');
  }catch(e){
    list.innerHTML='❌ Error loading: '+e.message;
    console.error(e);
  }
}
init();
</script>
